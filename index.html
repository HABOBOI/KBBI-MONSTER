<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>KATAKU – Kuis KBBI</title>
<style>
:root{--ink:#1e1b4b;--mut:#64748b;--pri:#4f46e5;--ok:#10b981;--bad:#f43f5e}
*{box-sizing:border-box;margin:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f5f6ff;color:var(--ink)}
main{max-width:448px;margin:auto;min-height:100vh;padding:24px 16px 96px}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #818cf8;outline-offset:2px}
button:disabled{cursor:default}
.c{display:block;width:100%;text-align:left;background:#fff;border:0;border-radius:24px;padding:20px;margin-bottom:12px;box-shadow:0 8px 24px #c7d2fe66}
.c.dis{opacity:.6}
.mut{color:var(--mut);font-size:14px}
.big{display:block;width:100%;border:0;border-radius:16px;padding:16px;margin-bottom:12px;background:var(--pri);color:#fff;font-size:18px;font-weight:800;box-shadow:0 8px 20px #a5b4fc88}
.big:active,.opt:active{transform:scale(.96)}
.lnk{display:block;width:100%;background:none;border:0;padding:8px;font-weight:700;color:var(--pri)}
.row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.row.sp{justify-content:space-between;font-size:14px;font-weight:600;color:var(--mut)}
.x{border:0;background:#fff;border-radius:12px;padding:6px 10px;box-shadow:0 2px 8px #0001}
.bar{flex:1;height:12px;border-radius:9px;background:#e2e8f0;overflow:hidden;margin-top:12px}
.row .bar{margin-top:0}
.bar i{display:block;height:100%;background:#6366f1}
.bar.gr i{background:var(--ok)}.bar.mi i{background:#fbbf24}.bar.lo i{background:var(--bad)}
.tm{font-size:20px;font-variant-numeric:tabular-nums}.tm.lo{color:#e11d48}
.q{text-align:center}
.w{font-size:clamp(36px,13vw,64px);font-weight:800;letter-spacing:-.02em;margin:32px 0;word-break:break-word}
.w.ok{color:#059669}.w.bad{color:#e11d48}
.fv{border:0;background:none;color:#f43f5e;font-size:14px}
.g2,.g4,.g2t{display:grid;gap:12px;margin-bottom:12px}
.g2,.g2t{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr);gap:8px}
.opt{border:0;border-radius:16px;padding:16px 12px;background:#fff;font-size:18px;font-weight:700;box-shadow:0 2px 8px #0001}
.opt small{display:block;font-size:12px;font-weight:500;opacity:.7}
.opt.r{background:var(--ok);color:#fff}.opt.w2{background:var(--bad);color:#fff}
.fb{border-radius:16px;padding:16px;font-size:14px}
.fb.g{background:#ecfdf5;color:#065f46}.fb.r{background:#fff1f2;color:#9f1239}
.fb .big{font-size:15px;padding:10px;margin:12px 0 0}
.tn{background:#eef2ff;color:#4338ca;border:0;border-radius:12px;padding:8px;font-weight:700}
.num{font-size:26px;font-weight:800}
.score{font-size:60px;font-weight:800;color:var(--pri);line-height:1.1}
.cols{display:flex;align-items:flex-end;gap:6px;height:120px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;color:var(--mut)}
.col i{width:100%;background:#6366f1;border-radius:6px 6px 0 0;min-height:2px}
.hb{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;font-size:13px;margin-top:8px}
.hb .bar{margin:0}.hb b{text-align:right}
.bdg.off{opacity:.4}
.tr{font-size:13px;border-top:1px solid #e2e8f0;padding:8px 0}
nav{position:fixed;left:0;right:0;bottom:0;margin:auto;max-width:448px;display:flex;justify-content:space-around;background:#ffffffe8;backdrop-filter:blur(8px);border-top:1px solid #e2e8f0;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;font-size:12px;font-weight:600;color:#94a3b8;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}nav .on{color:var(--pri)}
@media (prefers-reduced-motion:no-preference){
 #app>div{animation:in .2s ease-out}
 .w.ok{animation:pop .3s}.w.bad{animation:shk .35s}
 .bar.lo i{animation:pl 1s infinite}
}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shk{20%{transform:translateX(-10px)}50%{transform:translateX(10px)}80%{transform:translateX(-5px)}}
@keyframes pl{50%{opacity:.5}}
</style>
</head>
<body>
<main id="app"><noscript>Aktifkan JavaScript untuk memainkan KATAKU.</noscript></main>
<script>
/* ---------- Data kata (sumber: KBBI VI Daring) ---------- */
const K={KK:'Kata Kerja',KB:'Kata Benda',KS:'Kata Sifat',SR:'Kata Serapan',EJ:'Ejaan',BI:'Bentuk Berimbuhan',IS:'Istilah'};
const LV={E:'Easy',M:'Medium',H:'Hard',X:'Expert'};
// baku|tidak baku|kategori|level|arti
const RAW=`mengubah|merubah|BI|E|menjadikan lain dari semula
risiko|resiko|SR|E|akibat kurang menyenangkan dari suatu tindakan
aktivitas|aktifitas|SR|E|kegiatan atau kesibukan
analisis|analisa|SR|M|penyelidikan untuk mengetahui keadaan sebenarnya
apotek|apotik|KB|E|tempat menjual dan meracik obat
atlet|atlit|KB|E|olahragawan yang mengikuti perlombaan
izin|ijin|EJ|E|persetujuan membolehkan
jadwal|jadual|KB|E|pembagian waktu berdasarkan rencana
kualitas|kwalitas|SR|E|tingkat baik buruknya sesuatu
nasihat|nasehat|KB|E|ajaran atau pelajaran yang baik
objek|obyek|SR|M|hal yang menjadi sasaran
subjek|subyek|SR|M|pokok pembicaraan; pelaku
praktik|praktek|SR|M|pelaksanaan secara nyata
sistem|sistim|SR|E|perangkat unsur yang teratur
teknik|tehnik|SR|E|cara membuat atau melakukan sesuatu
hakikat|hakekat|EJ|M|inti atau dasar sesuatu
kuitansi|kwitansi|SR|M|tanda terima pembayaran
silakan|silahkan|KK|E|kata untuk mempersilakan
standar|standard|SR|E|ukuran yang disepakati
teladan|tauladan|KB|M|sesuatu yang patut ditiru
frekuensi|frekwensi|SR|M|kekerapan terjadinya sesuatu
kategori|katagori|SR|E|golongan atau penggolongan
hierarki|hirarki|SR|X|urutan tingkatan
konsekuensi|konsekwensi|SR|M|akibat dari suatu perbuatan
metode|metoda|SR|M|cara teratur untuk mencapai maksud
persentase|prosentase|SR|M|perbandingan dalam hitungan per seratus
sekadar|sekedar|EJ|E|hanya; sekecil-kecilnya
andal|handal|KS|M|dapat dipercaya
antre|antri|KK|M|berdiri berderet menunggu giliran
azan|adzan|KB|M|seruan untuk salat
bus|bis|KB|M|kendaraan besar pengangkut penumpang
cabai|cabe|KB|M|tumbuhan berbuah pedas
detail|detil|KB|M|bagian yang kecil-kecil
ekstrem|ekstrim|KS|M|paling ujung; keras
hipotesis|hipotesa|IS|H|dugaan sementara
karier|karir|KB|M|perkembangan dalam pekerjaan
kompleks|komplek|KB|H|gabungan beberapa hal; rumit
lembap|lembab|KS|X|agak basah
mengonsumsi|mengkonsumsi|BI|M|memakai atau menghabiskan barang
memengaruhi|mempengaruhi|BI|H|mendatangkan akibat pada sesuatu
menganalisis|menganalisa|BI|H|menyelidiki secara terperinci
salat|sholat|EJ|M|ibadah dalam agama Islam
Jumat|Jum'at|EJ|E|hari keenam dalam sepekan
November|Nopember|EJ|M|bulan kesebelas
Februari|Pebruari|EJ|M|bulan kedua
khawatir|kuatir|KS|M|takut terhadap sesuatu yang belum terjadi
tobat|taubat|KK|M|menyesali dan berhenti berbuat dosa
rezeki|rejeki|KB|M|segala sesuatu penunjang hidup
terampil|trampil|KS|M|cakap menyelesaikan tugas
utang|hutang|KB|M|uang yang dipinjam
zaman|jaman|KB|E|jangka waktu yang panjang
konkret|kongkrit|KS|M|nyata; dapat dilihat
sanksi|sangsi|KB|M|tanggungan untuk memaksa penaatan
impor|import|KK|M|memasukkan barang dari luar negeri
ekspor|eksport|KK|M|mengirim barang ke luar negeri
kaidah|kaedah|KB|X|aturan yang sudah pasti
wudu|wudhu|EJ|X|bersuci sebelum salat`;
const W=RAW.split('\n').map((r,i)=>{const[b,t,k,l,a]=r.split('|');return{id:i+1,baku:b,tidak:t,kategori:K[k],level:LV[l],arti:a}});

/* ---------- Penyimpanan (localStorage) ---------- */
const today=()=>new Date().toLocaleDateString('sv');
const init=()=>({xp:0,streak:0,last:'',lastDaily:'',sessions:[],words:{},days:{},fav:[],bestCombo:0});
let S;try{S={...init(),...JSON.parse(localStorage.getItem('kataku-v1')).state}}catch(e){S=init()}
const persist=()=>{try{localStorage.setItem('kataku-v1',JSON.stringify({state:S,version:0}))}catch(e){}};
function commit(s,ans,daily){
 const t=today(),y=new Date(Date.now()-864e5).toLocaleDateString('sv');
 ans.forEach(x=>{const r=S.words[x.id]||{a:0,c:0};S.words[x.id]={a:r.a+1,c:r.c+(x.ok?1:0)}});
 const d=S.days[t]||{a:0,c:0};S.days[t]={a:d.a+s.a,c:d.c+s.c};
 S.streak=S.last===t?S.streak:S.last===y?S.streak+1:1;S.last=t;
 if(daily)S.lastDaily=t;
 S.xp+=Math.floor(s.score/2)+s.c*2;S.bestCombo=Math.max(S.bestCombo,s.best);
 S.sessions=[...S.sessions,s].slice(-200);persist();
}

/* ---------- Logika ---------- */
const MODES=[
 {key:'quick',label:'Quick Quiz',desc:'10 soal · 1 menit',n:10,secs:60},
 {key:'standard',label:'Standard Quiz',desc:'20 soal · 3 menit',n:20,secs:180},
 {key:'hard',label:'Hard Quiz',desc:'30 soal · 5 menit · kata lebih sulit',n:30,secs:300,levels:['Medium','Hard','Expert']},
 {key:'endless',label:'Endless Mode',desc:'Tanpa batas waktu, berhenti kapan saja'},
 {key:'practice',label:'Practice Mode',desc:'Tanpa timer, lihat arti, simpan favorit',practice:true}];
const DAILY={key:'daily',label:'Daily Challenge',desc:'10 soal unik hari ini',n:10,secs:150,daily:true};
const BASE={Easy:10,Medium:15,Hard:20,Expert:30},COMBO={3:10,5:20,10:50};
const lvl=x=>Math.floor(Math.sqrt(x/40))+1;
const fmt=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const pct=r=>r&&r.a?Math.round(r.c/r.a*100):0;
const tot=s=>Object.values(s.words).reduce((n,r)=>n+r.a,0);
function seeded(s){let h=1779033703^s.length;for(const ch of s){h=Math.imul(h^ch.charCodeAt(0),3432918353);h=h<<13|h>>>19}let a=h;
 return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(x,r){const a=[...x];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(c){
 const r=c.daily?seeded(today()):Math.random;
 const pool=W.filter(w=>(!c.levels||c.levels.includes(w.level))&&(!c.ids||c.ids.includes(w.id)));
 const rounds=c.n&&c.n<=pool.length?1:Math.ceil((c.n||200)/pool.length);let out=[];
 for(let k=0;k<rounds;k++)out=out.concat(shuffle(pool,r).map(w=>({w,baku:r()<.5,flip:r()<.5})));
 return c.n?out.slice(0,c.n):out;
}
function rec(){
 const cat={};
 W.forEach(w=>{const r=S.words[w.id];if(r){const c=cat[w.kategori]||(cat[w.kategori]={a:0,c:0});c.a+=r.a;c.c+=r.c}});
 const l=Object.entries(cat).filter(([,r])=>r.a>=3).sort((x,y)=>pct(x[1])-pct(y[1]));
 if(!l.length)return 'Selesaikan beberapa sesi dulu, nanti saran latihan muncul di sini.';
 const[k,r]=l[0];
 return pct(r)>=90?'Akurasimu bagus di semua kategori. Coba Hard Quiz untuk tantangan baru!':`Kategori ${k} paling lemah (${pct(r)}%). Coba Practice Mode atau Latih Kata Lemah.`;
}
const BADGES=[
 ['Langkah Pertama','Selesaikan 1 sesi',s=>s.sessions.length>=1],
 ['50 Soal','Jawab 50 soal',s=>tot(s)>=50],
 ['Seratus','Jawab 100 soal',s=>tot(s)>=100],
 ['Pemburu Combo','Combo 10 berturut-turut',s=>s.bestCombo>=10],
 ['Rajin','Streak 3 hari',s=>s.streak>=3],
 ['Sempurna','100% di sesi ≥10 soal',s=>s.sessions.some(x=>x.a>=10&&x.a===x.c)],
 ['Naik Level','Capai level 3',s=>lvl(s.xp)>=3],
 ['Daily Hero','Selesaikan Daily Challenge',s=>!!s.lastDaily]];

/* ---------- Quiz ---------- */
let V='home',Z=null,R=null,RV=[];
const $=s=>document.querySelector(s);
function start(c){
 if(Z){clearInterval(Z.iv);clearTimeout(Z.nx)}
 Z={cfg:c,qs:build(c),i:0,score:0,combo:0,best:0,picked:null,ans:[],t0:Date.now(),tq:Date.now(),done:false,left:(c.secs||0)*1000};
 if(c.secs){Z.end=Z.t0+c.secs*1000;Z.iv=setInterval(()=>{Z.left=Math.max(0,Z.end-Date.now());tick();if(Z.left<=0)finish()},100)}
 V='quiz';drawQ();scrollTo(0,0);
}
function tick(){
 const b=$('#tb');if(!b)return;const c=Z.cfg;
 if(c.secs){const lo=Z.left<=10000,mi=Z.left<c.secs*400;
  b.style.width=Z.left/(c.secs*10)+'%';b.parentNode.className='bar'+(lo?' lo':mi?' mi':'');
  $('#tt').textContent=fmt(Z.left);$('#tt').classList.toggle('lo',lo)}
 else b.style.width=c.n?Z.i/c.n*100+'%':'0%';
}
function pick(b){
 if(Z.done||Z.picked!==null)return;
 const q=Z.qs[Z.i],c=Z.cfg,ok=b===q.baku,sec=(Date.now()-Z.tq)/1000;let pts=0;
 if(ok){Z.combo++;Z.best=Math.max(Z.best,Z.combo);pts=BASE[q.w.level]+(c.practice?0:Math.max(0,Math.round(5-sec))*2)+(COMBO[Z.combo]||0)}else Z.combo=0;
 Z.score+=pts;Z.ans.push({id:q.w.id,ok});Z.picked=b;
 if(!c.practice)Z.nx=setTimeout(next,ok?800:2400);
 drawQ();
}
function next(){
 if(Z.done)return;clearTimeout(Z.nx);
 if(Z.i+1>=Z.qs.length)return finish();
 Z.i++;Z.picked=null;Z.tq=Date.now();drawQ();
}
function finish(){
 if(Z.done)return;Z.done=true;clearInterval(Z.iv);clearTimeout(Z.nx);
 const a=Z.ans;if(!a.length)return go('home');
 const s={ts:Date.now(),mode:Z.cfg.key,score:Z.score,a:a.length,c:a.filter(x=>x.ok).length,best:Z.best,secs:Math.round((Date.now()-Z.t0)/1000)};
 const before=lvl(S.xp);commit(s,a,!!Z.cfg.daily);
 R={s,a,up:lvl(S.xp)>before};go('result');
}
function drawQ(){
 const c=Z.cfg,q=Z.qs[Z.i],p=Z.picked,ok=p===q.baku,opts=q.flip?[false,true]:[true,false];
 $('#app').innerHTML=`<div>
 <div class="row"><button class="x" data-a="fin" aria-label="Selesai">✕</button><div class="bar"><i id="tb"></i></div><b id="tt" class="tm">${c.secs?fmt(Z.left):'∞'}</b></div>
 <div class="row sp"><span>${c.n?`${Z.i+1}/${c.n}`:`Soal ${Z.i+1}`}</span><b style="color:#f97316">${Z.combo>=2?'🔥 x'+Z.combo:''}</b><span>Skor ${Z.score}</span></div>
 <div class="c q"><p class="mut">Kata berikut merupakan kata …?</p>
  <div class="w ${p===null?'':ok?'ok':'bad'}">${q.baku?q.w.baku:q.w.tidak}</div>
  ${c.practice?`<button class="fv" data-a="fav">${S.fav.includes(q.w.id)?'♥':'♡'} Favorit</button>`:''}</div>
 <div class="g2">${opts.map(b=>{const right=p!==null&&b===q.baku,wrong=p===b&&b!==q.baku;
  return `<button class="opt ${right?'r':wrong?'w2':''}" ${p!==null?'disabled':''} data-a="pick" data-v="${b?1:0}">${b?'Baku':'Tidak Baku'}<small>${b?'Sesuai KBBI':'Tidak sesuai KBBI'}</small></button>`}).join('')}</div>
 ${p!==null?`<div class="fb ${ok?'g':'r'}"><b>${ok?'Benar!':'Belum tepat'}</b>${!ok||c.practice?`<p>Yang baku: <b>${q.w.baku}</b> (bukan ${q.w.tidak}). Arti: ${q.w.arti}. Sumber: KBBI VI Daring.</p><button class="big" data-a="next">Lanjut</button>`:''}</div>`:''}
 </div>`;
 tick();
}

/* ---------- Tampilan lain ---------- */
const tile=(t,x)=>`<div class="c" style="margin:0"><p class="mut">${t}</p><p class="num">${x}</p></div>`;
const grp=f=>{const o={};W.forEach(w=>{const r=S.words[w.id];if(r){const c=o[f(w)]||(o[f(w)]={a:0,c:0});c.a+=r.a;c.c+=r.c}});return Object.entries(o).map(([n,r])=>({n,acc:pct(r)}))};
const hbars=d=>d.length?d.map(x=>`<div class="hb"><span>${x.n}</span><div class="bar"><i style="width:${x.acc}%"></i></div><b>${x.acc}%</b></div>`).join(''):'<p class="mut">Belum ada data.</p>';
const NAV=[['home','🏠','Beranda'],['stats','📊','Statistik'],['weak','📕','Kata Lemah'],['profile','👤','Profil']];
const weakList=()=>W.filter(w=>{const r=S.words[w.id];return r&&r.a>=1&&pct(r)<70}).sort((a,b)=>pct(S.words[a.id])-pct(S.words[b.id]));
const dailyBtn=d=>`<button class="c ${d?'dis':''}" ${d?'disabled':''} data-a="start" data-v="daily"><b>Daily Challenge ${d?'✓':''}</b><p class="mut">${d?'Selesai! Kembali lagi besok.':'10 soal unik hari ini, jaga streak-mu'}</p></button>`;
const modeBtn=m=>`<button class="c" data-a="start" data-v="${m.key}"><b>${m.label}</b><p class="mut">${m.desc}</p></button>`;

const VIEWS={
 home(){const L=lvl(S.xp),base=40*(L-1)**2,nx=40*L*L,td=Math.min(S.days[today()]?.a||0,10);
  return `<div><p class="mut" style="font-size:16px">Halo, jagoan KBBI!</p><h1>Sudah latihan hari ini?</h1>
  <div class="c"><div class="row sp" style="margin:0;color:inherit;font-size:16px"><b>Level ${L}</b><b style="color:#f97316">🔥 ${S.streak} hari</b></div><div class="bar"><i style="width:${(S.xp-base)/(nx-base)*100}%"></i></div><p class="mut" style="font-size:12px;margin-top:4px">${S.xp} / ${nx} XP</p></div>
  <div class="c"><b>Target hari ini: ${td}/10 soal</b><div class="bar gr"><i style="width:${td*10}%"></i></div></div>
  <button class="big" data-a="go" data-v="modes">Mulai Quiz</button>${dailyBtn(S.lastDaily===today())}</div>`},
 modes(){return `<div><h1>Pilih mode</h1>${MODES.slice(0,3).map(modeBtn).join('')}
  <div class="c"><b>Time Attack</b><p class="mut" style="margin-bottom:12px">Jawab sebanyak mungkin sampai waktu habis</p><div class="g4" style="margin:0">${[1,3,5,10].map(n=>`<button class="tn" data-a="ta" data-v="${n}">${n} mnt</button>`).join('')}</div></div>
  ${MODES.slice(3).map(modeBtn).join('')}${dailyBtn(S.lastDaily===today())}</div>`},
 result(){const{s,a,up}=R,wr=[...new Set(a.filter(x=>!x.ok).map(x=>x.id))].map(id=>W.find(w=>w.id===id));RV=wr.map(w=>w.id);
  return `<div><div class="c" style="text-align:center"><p class="mut" style="font-size:16px">Skor akhir</p><p class="score">${s.score}</p>
  <p style="font-size:14px;margin-top:8px">Akurasi ${Math.round(s.c/s.a*100)}% · ${s.c}/${s.a} benar · combo terbaik ${s.best}${up?' · Naik level! 🎉':''}</p></div>
  <div class="c" style="font-size:14px"><b>Saran:</b> ${rec()}</div>
  ${wr.length?`<div class="c"><b>Review kesalahan</b>${wr.map(w=>`<p class="tr"><b>${w.baku}</b> (bukan ${w.tidak}) — ${w.arti}</p>`).join('')}<button class="big" style="margin:12px 0 0" data-a="rev">Latih Kata yang Salah</button></div>`:''}
  <button class="big" data-a="again">Main lagi</button><button class="lnk" data-a="go" data-v="home">Beranda</button></div>`},
 stats(){const A=tot(S),C=Object.values(S.words).reduce((n,r)=>n+r.c,0),m=Math.round(S.sessions.reduce((n,s)=>n+s.secs,0)/60);
  const days=[...Array(7)].map((_,k)=>{const d=new Date(Date.now()-(6-k)*864e5);return{d:`${d.getDate()}/${d.getMonth()+1}`,acc:pct(S.days[d.toLocaleDateString('sv')])}});
  return `<div><h1>Statistik</h1><div class="g2">${tile('Total soal',A)}${tile('Akurasi',A?Math.round(C/A*100)+'%':'-')}${tile('Waktu belajar',m+' mnt')}${tile('Streak',S.streak+' hari')}</div>
  <div class="c"><b>Akurasi 7 hari</b>${A?`<div class="cols" style="margin-top:12px">${days.map(x=>`<div class="col" title="${x.acc}%"><i style="height:${x.acc}%"></i>${x.d}</div>`).join('')}</div>`:'<p class="mut">Belum ada data. Main satu sesi dulu!</p>'}</div>
  <div class="c"><b>Per kategori</b>${hbars(grp(w=>w.kategori))}</div><div class="c"><b>Per tingkat</b>${hbars(grp(w=>w.level))}</div>
  <div class="c" style="font-size:14px"><b>Saran sesi berikutnya:</b> ${rec()}</div></div>`},
 weak(){const l=weakList();RV=l.map(w=>w.id);
  return `<div><h1>Kata Lemah</h1>${l.length?`<button class="big" data-a="rev">Latih ${l.length} kata ini</button>${l.map(w=>`<div class="c row sp" style="padding:16px;color:inherit;font-size:16px"><span><b>${w.baku}</b> <span class="mut">bukan ${w.tidak}</span></span><b style="color:#e11d48">${pct(S.words[w.id])}%</b></div>`).join('')}`:'<p class="mut">Belum ada kata lemah. Selesaikan beberapa sesi dulu.</p>'}</div>`},
 profile(){const L=lvl(S.xp);
  return `<div><h1>Profil</h1><div class="c" style="text-align:center"><p class="score">Lv ${L}</p><p class="mut">${S.xp} XP · streak ${S.streak} hari</p></div>
  <div class="g2">${BADGES.map(([n,d,f])=>`<div class="c bdg ${f(S)?'':'off'}" style="margin:0;padding:16px"><span>${f(S)?'🏆':'🔒'}</span><p style="font-size:14px;font-weight:700">${n}</p><p class="mut" style="font-size:12px">${d}</p></div>`).join('')}</div>
  <button class="lnk" style="color:#e11d48;font-size:14px;margin-top:12px" data-a="reset">Reset data</button></div>`}
};
function go(v){V=v;scrollTo(0,0);if(v==='quiz')return drawQ();
 $('#app').innerHTML=VIEWS[v]()+`<nav>${NAV.map(([k,i,t])=>`<button class="${V===k?'on':''}" data-a="go" data-v="${k}"><span>${i}</span>${t}</button>`).join('')}</nav>`}

/* ---------- Event ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v;
 if(a==='go')go(v);
 else if(a==='start')start(v==='daily'?DAILY:MODES.find(m=>m.key===v));
 else if(a==='ta')start({key:'ta',label:'Time Attack',secs:+v*60});
 else if(a==='rev')start({key:'review',label:'Latih Kata',n:RV.length,ids:RV});
 else if(a==='again')start(Z.cfg);
 else if(a==='pick')pick(v==='1');
 else if(a==='next')next();
 else if(a==='fin')finish();
 else if(a==='fav'){const id=Z.qs[Z.i].w.id;S.fav=S.fav.includes(id)?S.fav.filter(x=>x!==id):[...S.fav,id];persist();drawQ()}
 else if(a==='reset'&&confirm('Hapus semua progres?')){S=init();persist();go('profile')}
});
go('home');
</script>
</body>
</html>
